name: deploy-api

# Deploys ONLY the celebratebanner-api Fly app (api + worker + recovery process groups
# from one image). The API carries a migration release_command, so this is deliberately
# narrow: it fires only on a change to backend-stub/ or to this workflow, never as a side
# effect of a web, render-engine, docs or marketing change.
#
# celebratebanner-web is deployed by deploy-web.yml and is not touched here.
on:
  # Path-scoped: only a change to code that ships INSIDE the API image can release the API.
  # A web-only, docs or marketing change never reaches this workflow.
  #
  # shared/render-engine/** is included because backend-stub/Dockerfile COPYs and builds it
  # into this image (backend-stub/package.json depends on it via `file:`), and the render
  # worker executes it. Omitting it caused real deployment drift during the text-fit
  # incident: deploy-web shipped the corrected renderer while the production worker kept
  # rendering with the old one until the API deploy was dispatched by hand.
  push:
    branches: [main]
    paths:
      - 'backend-stub/**'
      - 'shared/render-engine/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this deploy is happening (recorded in the run)'
        required: false
        default: 'manual'

concurrency:
  group: deploy-api
  cancel-in-progress: false          # never cancel a deploy mid-flight

jobs:
  deploy:
    name: deploy celebratebanner-api
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: reason
        run: echo "Deploy reason - ${{ inputs.reason || 'push to backend-stub' }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The suite is intentionally dependency-free (no npm ci): it exercises pure modules
      # and stubs anything third-party, so it runs fast and cannot be broken by a registry
      # hiccup on the way to a production deploy.
      - name: backend tests
        working-directory: backend-stub
        run: node --test

      # A missing import is invisible to the dependency-free suite above: the analytics
      # release passed every test and then crashed every machine on boot. Install production
      # dependencies and actually load server.js before releasing.
      - name: verify the server boots
        working-directory: backend-stub
        env:
          # Mirror production exactly: NODE_ENV=test would pull in pino-pretty, a
          # devDependency that --omit=dev correctly does not install.
          NODE_ENV: production
          PORT: '0'
          DATABASE_URL: postgres://user:pass@127.0.0.1:5432/db
          PG_SSL: disable
          PUBLIC_SITE_URL: https://example.test
          API_PUBLIC_URL: https://api.example.test
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          REDIS_URL: redis://127.0.0.1:6379
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          S3_BUCKET: dummy-bucket
          S3_CDN_BASE: https://cdn.example.test
          DOWNLOAD_TOKEN_SECRET: dddddddddddddddddddddddddddddddd
          POSTMARK_API_TOKEN: dummy
          MAIL_FROM: CelebrateBanner <noreply@example.test>
          ADMIN_JWT_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          # Mirror the Dockerfile: the render engine is a file: dependency whose dist/ is
          # gitignored, so it must be built from source before backend deps resolve.
          (cd ../shared/render-engine && npm ci && npm run build)
          npm ci --omit=dev
          node -e "require('./server.js'); console.log('BOOT_OK'); process.exit(0);"

      - name: check API deploy credential
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_API }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::FLY_API_TOKEN_API resolved to an EMPTY value for this job."
            echo "::error::It must be a REPOSITORY secret (Settings, Secrets and variables,"
            echo "::error::Actions, Repository secrets) app-scoped to celebratebanner-api."
            echo "::error::Environment and Dependabot secrets are separate stores and are not visible here."
            exit 1
          fi
          echo "FLY_API_TOKEN_API present."

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # The trailing "." is the build CONTEXT and must be the repo ROOT, because the
      # Dockerfile COPYs both shared/render-engine/ and backend-stub/. The dockerfile PATH
      # comes from fly.toml and is resolved relative to that file's own directory, so it is
      # simply "Dockerfile" — passing --dockerfile backend-stub/Dockerfile here made flyctl
      # look for backend-stub/backend-stub/Dockerfile. The release_command in fly.toml runs
      # node db/migrate.js once before the new version takes traffic.
      - name: deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_API }}
        run: |
          set -o pipefail
          # Prefer Fly's remote builder. It can fail for reasons that have nothing to do
          # with this repo — the builder machine is an org-level resource, so an app-scoped
          # deploy token may not be able to provision one, and the fleet itself sometimes
          # returns "failed to list workers / handshake failed". Fall back to building the
          # image on this runner and pushing it, which needs only app-scoped registry access.
          if flyctl deploy --remote-only --config backend-stub/fly.toml . ; then
            echo "deployed via remote builder"
          else
            echo "::warning::remote builder unavailable — falling back to a local build"
            flyctl auth docker
            flyctl deploy --local-only --config backend-stub/fly.toml .
            echo "deployed via local build"
          fi

      - name: verify the API is healthy
        run: |
          set -e
          ok=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/dep.json -w '%{http_code}' https://api.celebratebanner.com/health/dependencies || true)
            if [ "$code" = "200" ]; then
              cat /tmp/dep.json
              echo
              ok=$(python3 -c "import json;print(json.load(open('/tmp/dep.json'))['ok'])")
              echo "overall ok = $ok"
              break
            fi
            echo "  [$i] health=$code, waiting"
            sleep 10
          done
          [ "$ok" = "True" ] || { echo "::error::API dependencies unhealthy after deploy"; exit 1; }

      - name: verify the claim fix is live
        run: |
          set -e
          API=https://api.celebratebanner.com
          ORIGIN='Origin: https://app.celebratebanner.com'
          PID="proj_ci$(date +%s | tail -c 8)"
          SHA=$(head -c 32 /dev/urandom | sha256sum | cut -d' ' -f1)
          echo "project $PID"

          echo "1) signed upload - this pre-creates the projects row"
          code=$(curl -s -o /tmp/signed.json -w '%{http_code}' -X POST "$API/api/uploads/signed" \
            -H 'Content-Type: application/json' -H "$ORIGIN" \
            -d "{\"projectId\":\"$PID\",\"templateId\":\"graduation\",\"filename\":\"t.png\",\"contentType\":\"image/png\",\"bytes\":1024,\"sha256\":\"$SHA\",\"width\":64,\"height\":64}")
          echo "   HTTP $code"
          [ "$code" = "200" ] || { echo "::error::signed upload failed"; cat /tmp/signed.json; exit 1; }

          echo "2) FIRST autosave after that upload - this is what used to return 403"
          RI="{\"version\":1,\"projectId\":\"$PID\",\"width\":800,\"height\":1200,\"arrangement\":\"classic\",\"theme\":{\"id\":\"graduation\",\"fields\":[\"name\"],\"palette\":{\"bg\":\"#0C0E14\",\"accent\":\"#C9A84C\",\"text\":\"#FAF8F3\"}},\"bannerText\":{\"name\":\"CI\"},\"photos\":[{\"id\":\"p1\",\"url\":\"https://example.com/a.png\",\"width\":64,\"height\":64}],\"heroId\":\"p1\",\"frames\":{},\"defaultFrame\":\"rounded\",\"rotations\":{},\"seed\":1,\"cinematicHero\":true}"
          code=$(curl -s -o /tmp/save1.json -w '%{http_code}' -X PATCH "$API/api/projects/$PID" \
            -H 'Content-Type: application/json' -H "$ORIGIN" \
            -d "{\"renderInput\":$RI,\"rev\":0}")
          cat /tmp/save1.json
          echo
          [ "$code" = "200" ] || { echo "::error::claim fix NOT live - first autosave returned $code"; exit 1; }
          echo "   PASS - upload then first autosave returned 200"
