name: deploy-web

# Deploys /web to a configurable host. The default `build-artifact` job uploads
# the Next.js build as a workflow artifact, then a deploy job ships it to whichever
# host you choose. Uncomment + fill in the deploy step for your target.
#
# Triggers: push to main that touches /web or shared/render-engine.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'shared/render-engine/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:                # allow manual deploys from the Actions tab

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false        # never cancel a deploy mid-flight

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build render engine
        working-directory: shared/render-engine
        run: |
          npm ci
          npm run build

      - name: install web deps
        working-directory: web
        run: npm ci

      - name: build
        working-directory: web
        env:
          # NON-SECRET, and must never be empty: `next build` calls new URL() on
          # NEXT_PUBLIC_SITE_URL for metadataBase, and an empty string throws
          # ERR_INVALID_URL while collecting /_not-found. The fallbacks are the same
          # authoritative values fly.web.toml passes as build args, so this artifact build
          # matches the image the Fly deploy actually ships.
          NEXT_PUBLIC_SITE_URL:               ${{ vars.PUBLIC_SITE_URL || 'https://app.celebratebanner.com' }}
          NEXT_PUBLIC_API_BASE_URL:           ${{ vars.API_BASE_URL || 'https://api.celebratebanner.com' }}
          # Intentionally EMPTY, matching fly.web.toml: the static payment link cannot carry
          # projectId metadata, so an order paid through it would never be fulfilled.
          NEXT_PUBLIC_LEGACY_STRIPE_LINK:     ''
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            web/.next
            web/public
            web/package.json
            web/package-lock.json
            web/next.config.mjs
          retention-days: 7

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      # AUTHORITATIVE TARGET: Fly.io (`celebratebanner-web`). Uncomment Option A to enable.
      # The build job above produces a `web-build` artifact for inspection; the Fly deploy
      # builds the production image itself (Dockerfile.web), so it does not consume that
      # artifact. Options B and C are illustrative alternates only and are NOT used by
      # CelebrateBanner — do not enable them.

      # ── Option A · Fly.io (authoritative, ENABLED) ─────────────────────────
      # Build context = repo ROOT because /web depends on shared/render-engine via a file: path.
      # Deploys ONLY celebratebanner-web. The API (celebratebanner-api) is deliberately not
      # deployed here: it is a separate Fly app with its own release_command (migrations) and
      # three process groups, and it must never ship as a side effect of a web change.
      #
      # fly.web.toml already carries every NEXT_PUBLIC_* the app reads
      # (SITE_URL, API_BASE_URL, LEGACY_STRIPE_LINK), so FLY_API_TOKEN is the only secret
      # this deploy needs.
      - name: check deploy credential
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::FLY_API_TOKEN resolved to an EMPTY value for this job."
            echo "::error::It must be a REPOSITORY secret on ducksoncadet3-glitch/celebratebanner-app:"
            echo "::error::  Settings -> Secrets and variables -> Actions -> Repository secrets"
            echo "::error::This repo also has Environments (Production, github-pages, ...). A secret"
            echo "::error::stored under an Environment is NOT visible here, because this job declares"
            echo "::error::no 'environment:'. Environment and Dependabot secrets are separate stores."
            echo "::error::Token should be app-scoped to the Fly app 'celebratebanner-web'."
            exit 1
          fi
          echo "FLY_API_TOKEN present."

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: deploy celebratebanner-web
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config fly.web.toml --dockerfile Dockerfile.web .

      - name: verify the release is serving
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://app.celebratebanner.com/api/health || true)
            [ "$code" = "200" ] && echo "health OK" && break
            sleep 5
          done
          # The corrected proof copy only exists from commit 61c8540 onward, so its presence
          # proves the NEW build is live rather than the previous stale one.
          if curl -sf https://app.celebratebanner.com/proof | grep -q "See your design before you pay"; then
            echo "Release verified: corrected proof copy is live."
          else
            echo "::error::Deployed build does not contain the corrected proof copy."
            exit 1
          fi

      # ── Option B · Cloudflare Pages (NOT used — illustrative only) ─────────
      # - name: deploy to Cloudflare Pages
      #   uses: cloudflare/wrangler-action@v3
      #   with:
      #     apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      #     command: pages deploy web-build/.next/standalone --project-name=celebratebanner-web --branch=main

      # ── Option C · Raw rsync to a VPS (NOT used — illustrative only) ───────
      # - name: rsync to host
      #   uses: easingthemes/ssh-deploy@v5
      #   with:
      #     SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      #     REMOTE_HOST:     ${{ secrets.DEPLOY_HOST }}
      #     REMOTE_USER:     deploy
      #     SOURCE:          'web-build/'
      #     TARGET:          '/srv/celebratebanner-web/releases/${{ github.sha }}'
      #     SCRIPT_AFTER: |
      #       ln -sfn /srv/celebratebanner-web/releases/${{ github.sha }} /srv/celebratebanner-web/current
      #       systemctl restart celebratebanner-web

